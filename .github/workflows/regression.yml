name: VersusLab CI/CD Pipeline

on:
  pull_request:
    paths:
      - "apps/**"
      - "evals/**"
      - "scripts/**"
      - ".github/workflows/regression.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "evals/**"
      - "scripts/**"
      - ".github/workflows/regression.yml"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Linting & Security Vulnerability Scanning
  # ---------------------------------------------------------------------------
  lint-and-audit:
    name: Code Quality & Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Python Backend Lint & Dependency Audit
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies & Security Scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff pip-audit

      - name: Lint Backend with Ruff
        run: |
          cd apps/api
          ruff check .

      - name: Security Scan Python Dependencies (pip-audit)
        run: |
          pip-audit -r apps/api/requirements.txt

      # Node.js Frontend Lint & Dependency Audit
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Lint Frontend with ESLint
        run: |
          cd apps/web
          npm run lint

      - name: Security Scan Frontend Dependencies (npm audit)
        run: |
          cd apps/web
          npm audit --omit=dev

  # ---------------------------------------------------------------------------
  # Job 2: Hermetic Unit Tests (Backend)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Full Backend Unit Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Hermetic Pytest Suite
        run: |
          cd apps/api
          pytest -v

  # ---------------------------------------------------------------------------
  # Job 3: Build Verification (Frontend & Backend)
  # ---------------------------------------------------------------------------
  build-check:
    name: Application Production Builds
    runs-on: ubuntu-latest
    needs: [lint-and-audit]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Build Next.js Web Application
        run: |
          cd apps/web
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # Job 4: Quality Regression Gate against PostgreSQL
  # ---------------------------------------------------------------------------
  regression-check:
    name: Quality Regression Gate against Mock Baseline
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: versuslab
          POSTGRES_PASSWORD: versuslab
          POSTGRES_DB: versuslab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Quality Regression Gate against Mock Baseline
        env:
          DATABASE_URL: postgresql+asyncpg://versuslab:versuslab@localhost:5432/versuslab
        run: |
          python scripts/run_ci_regression.py
